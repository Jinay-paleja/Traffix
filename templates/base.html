<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Traffix - Smart Traffic Signal Optimizer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  {% block extra_css %}{% endblock %}
</head>
<body>
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
      <path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-intersections" viewBox="0 0 24 24">
      <path d="M12 3v18M3 12h18M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-profile" viewBox="0 0 24 24">
      <path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-overview" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24">
      <path d="M3 5h18v12H3zM8 19h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-signal-control" viewBox="0 0 24 24">
      <path d="M8 19V5M8 8h8M8 12h8M8 16h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="16" cy="8" r="1.4" fill="currentColor"/>
      <circle cx="16" cy="12" r="1.4" fill="currentColor" opacity="0.75"/>
      <circle cx="16" cy="16" r="1.4" fill="currentColor" opacity="0.5"/>
    </symbol>
    <symbol id="icon-signal-view" viewBox="0 0 24 24">
      <path d="M4 6h16v12H4zM8 10h8M8 14h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-logout" viewBox="0 0 24 24">
      <path d="M10 17l5-5-5-5M15 12H4M20 4v16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-messages">
        {% for category, message in messages %}
          <div class="flash {{ category }}" role="status">
            <div class="flash-content">{{ message }}</div>
            <button type="button" class="flash-close" aria-label="Dismiss notification">&times;</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
</body>
</html>
