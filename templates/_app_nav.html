<aside class="site-sidebar">
  <div class="nav-brand-container nav-brand-row">
    <a href="{{ url_for('index') }}" class="nav-brand nav-brand-compact">
      <img src="{{ url_for('static', filename='images/traffix-mark.svg') }}" alt="" class="nav-brand-mark" aria-hidden="true">
      <span class="nav-brand-text">Traff<span>ix</span></span>
    </a>
    <button class="btn btn-ghost sidebar-collapse-btn sidebar-collapse-btn-compact" aria-label="Collapse sidebar" onclick="toggleSidebar()">
      <span class="icon-inline icon-inline-compact"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
  </div>
  <nav class="nav-links">
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost{% if active_page == 'dashboard' %} active{% endif %}" title="Dashboard"><span class="icon-inline"><svg viewBox="0 0 24 24"><use href="#icon-dashboard"/></svg></span><span class="nav-text">Dashboard</span></a>
    <a href="{{ url_for('intersections') }}" class="btn btn-ghost{% if active_page == 'intersections' %} active{% endif %}" title="Intersections"><span class="icon-inline"><svg viewBox="0 0 24 24"><use href="#icon-intersections"/></svg></span><span class="nav-text">Intersections</span></a>
    <a href="{{ url_for('profile') }}" class="btn btn-ghost{% if active_page == 'profile' %} active{% endif %}" title="Profile"><span class="icon-inline"><svg viewBox="0 0 24 24"><use href="#icon-profile"/></svg></span><span class="nav-text">Profile</span></a>
  </nav>
</aside>

<header class="workspace-topbar">
  <div class="workspace-status" title="System status">
    <div class="workspace-status-pill">
      <span class="workspace-status-dot" aria-hidden="true"></span>
      <span class="workspace-status-text">System Online</span>
    </div>
    <span id="live-clock" class="workspace-clock">--:--</span>
  </div>
  <button id="theme-toggle" class="btn btn-ghost topbar-btn" aria-label="Toggle dark mode" onclick="toggleTheme()">
    <span class="icon-inline icon-inline-compact"><svg viewBox="0 0 24 24" id="theme-icon"><use href="#icon-sun"/></svg></span>
  </button>
  <div class="topbar-sep" aria-hidden="true"></div>
  <a href="{{ url_for('profile') }}" class="btn btn-ghost topbar-btn">
    <img src="{{ url_for('static', filename='images/traffix-mark.svg') }}" class="topbar-avatar" alt="">
    <span class="topbar-account-label">Account</span>
  </a>
  <a href="{{ url_for('logout') }}" class="btn btn-secondary topbar-btn">Log out</a>
</header>
<script>
  function toggleTheme() {
    const root = document.documentElement;
    root.classList.toggle('light-mode');
    const isLight = root.classList.contains('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-icon').innerHTML = isLight ? '<use href="#icon-moon"/>' : '<use href="#icon-sun"/>';
  }
  function toggleSidebar() {
    document.body.classList.toggle('sidebar-collapsed');
    localStorage.setItem('sidebar-collapsed', document.body.classList.contains('sidebar-collapsed'));
  }
  function updateClock() {
    const clock = document.getElementById('live-clock');
    if (!clock) return;
    const now = new Date();
    clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(updateClock, 60000);
  updateClock();
  // Initialize icon state
  if (document.documentElement.classList.contains('light-mode')) {
    document.getElementById('theme-icon').innerHTML = '<use href="#icon-moon"/>';
  }
  // Initialize sidebar
  if (localStorage.getItem('sidebar-collapsed') === 'true') {
    document.body.classList.add('sidebar-collapsed');
  }
</script>
