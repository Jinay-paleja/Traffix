<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Detection - Traffix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .detection-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .detection-header h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }

        .detection-header p {
            color: #666;
            margin: 0;
            font-size: 1.1em;
        }

        .intersection-selector {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .intersection-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }

        .intersection-selector select:focus {
            outline: none;
            border-color: #667eea;
        }

        .lanes-container {
            display: none;
        }

        .detection-main {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .detection-main {
                grid-template-columns: 1fr;
            }
        }

        .detection-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .detection-box h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .lane-upload-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .lane-upload-box h3 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.3em;
            text-transform: capitalize;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-area-text {
            color: #667eea;
            margin: 0;
            font-size: 1em;
            font-weight: 500;
        }

        .upload-area-hint {
            color: #999;
            margin-top: 8px;
            font-size: 0.85em;
        }

        .upload-preview {
            margin-top: 10px;
            font-size: 0.9em;
            color: #4CAF50;
            font-weight: 500;
        }

        .btn-detect {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-detect:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .btn-detect:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .result-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .result-value {
            color: #333;
            font-size: 1.8em;
            font-weight: 700;
        }

        .density-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 10px;
            color: white;
        }

        .density-low { background: #4CAF50; }
        .density-medium { background: #FF9800; }
        .density-high { background: #F44336; }
        .density-critical { background: #8B0000; }

        .lane-results {
            margin-bottom: 30px;
            display: none;
        }

        .lane-result-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border-left: 6px solid #667eea;
        }

        .lane-result-title {
            color: #667eea;
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border-left: 4px solid #c62828;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            border-left: 4px solid #4CAF50;
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-back:hover {
            transform: translateX(-5px);
        }

        .nav-back::before {
            content: "← ";
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('dashboard') }}" class="nav-back">Back to Dashboard</a>

        <div class="detection-header">
            <h1>🚗 Traffic Detection by Lane</h1>
            <p>Analyze traffic for each lane using AI-powered vehicle detection</p>
        </div>

        <!-- Intersection Selector -->
        <div class="intersection-selector">
            <label for="intersection-select" style="display: block; margin-bottom: 10px; color: #333; font-weight: 600;">Select Intersection</label>
            <select id="intersection-select">
                <option value="">-- Select an intersection --</option>
                {% for intersection in intersections %}
                <option value="{{ intersection.id }}" data-lanes="{{ intersection.lanes | tojson }}">{{ intersection.name }} ({{ intersection.location }}) - {{ intersection.lanes | length }} lanes</option>
                {% endfor %}
            </select>
        </div>

        <!-- Lanes Container -->
        <div class="lanes-container" id="lanesContainer">
            <!-- Lane upload boxes will be inserted here -->
        </div>

        <!-- Analyze Button (shown when intersection selected) -->
        <div style="display: none;" id="analyzeButtonContainer">
            <button class="btn-detect" id="detectBtn">Analyze All Lanes</button>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        const intersectionSelect = document.getElementById('intersection-select');
        const lanesContainer = document.getElementById('lanesContainer');
        const analyzeButtonContainer = document.getElementById('analyzeButtonContainer');
        const detectBtn = document.getElementById('detectBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const selectedImages = {};

        intersectionSelect.addEventListener('change', (e) => {
            if (!e.target.value) {
                lanesContainer.style.display = 'none';
                analyzeButtonContainer.style.display = 'none';
                resultsContainer.innerHTML = '';
                selectedImages = {};
                return;
            }

            const option = e.target.options[e.target.selectedIndex];
            const lanes = JSON.parse(option.getAttribute('data-lanes'));

            if (lanes.length === 0) {
                lanesContainer.innerHTML = '<p style="color: #999;">This intersection has no lanes.</p>';
                analyzeButtonContainer.style.display = 'none';
                return;
            }

            // Clear previous images
            for (let key in selectedImages) delete selectedImages[key];

            // Generate upload areas for each lane
            let html = '';
            lanes.forEach((lane, idx) => {
                const laneId = lane.id || idx;
                const direction = lane.direction.toLowerCase();
                html += `
                    <div class="lane-upload-box">
                        <h3>📸 ${lane.direction}</h3>
                        <div class="upload-area" data-lane-id="${laneId}" data-direction="${direction}">
                            <input type="file" class="lane-image-input" data-lane-id="${laneId}" accept="image/*" style="display: none;">
                            <p class="upload-area-text">Click to upload or drag and drop</p>
                            <p class="upload-area-hint">JPG, PNG, WebP (max 10MB)</p>
                            <div class="upload-preview" style="display: none;"></div>
                        </div>
                    </div>
                `;
            });

            lanesContainer.innerHTML = html;
            lanesContainer.style.display = null;
            analyzeButtonContainer.style.display = 'block';
            resultsContainer.innerHTML = '';

            // Setup drag and drop for each lane
            document.querySelectorAll('.lane-upload-box .upload-area').forEach(dropzone => {
                const laneId = dropzone.getAttribute('data-lane-id');
                const fileInput = dropzone.querySelector('.lane-image-input');
                const preview = dropzone.querySelector('.upload-preview');

                dropzone.addEventListener('click', () => fileInput.click());

                dropzone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    dropzone.classList.add('dragover');
                });

                dropzone.addEventListener('dragleave', () => {
                    dropzone.classList.remove('dragover');
                });

                dropzone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('dragover');
                    if (e.dataTransfer.files.length > 0) {
                        fileInput.files = e.dataTransfer.files;
                        handleImageSelect(laneId, e.dataTransfer.files[0], dropzone);
                    }
                });

                fileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        handleImageSelect(laneId, e.target.files[0], dropzone);
                    }
                });
            });
        });

        function handleImageSelect(laneId, file, dropzone) {
            selectedImages[laneId] = file;
            const preview = dropzone.querySelector('.upload-preview');
            preview.textContent = `✓ ${file.name} selected`;
            preview.style.display = 'block';
        }

        detectBtn.addEventListener('click', async () => {
            const intersectionId = intersectionSelect.value;
            if (!intersectionId) {
                alert('Please select an intersection');
                return;
            }

            if (Object.keys(selectedImages).length === 0) {
                alert('Please upload at least one image');
                return;
            }

            detectBtn.disabled = true;
            resultsContainer.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing traffic for all lanes...</div>';

            const formData = new FormData();
            formData.append('intersection_id', intersectionId);
            
            // Add all images
            for (const [laneId, file] of Object.entries(selectedImages)) {
                formData.append(`images[${laneId}]`, file);
            }

            try {
                const response = await fetch('/api/analyze-traffic', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    displayResults(data);
                } else {
                    resultsContainer.innerHTML = `<div class="error-message"><strong>Error:</strong> ${data.error || 'Analysis failed'}</div>`;
                }
            } catch (error) {
                resultsContainer.innerHTML = `<div class="error-message"><strong>Error:</strong> ${error.message}</div>`;
            } finally {
                detectBtn.disabled = false;
            }
        });

        function displayResults(data) {
            let html = '<div style="margin-top: 30px;">';

            if (data.results && typeof data.results === 'object') {
                for (const [laneId, result] of Object.entries(data.results)) {
                    html += `
                        <div class="lane-result-card">
                            <div class="lane-result-title">${result.direction}</div>
                            <div class="result-item">
                                <div class="result-label">Vehicles Detected</div>
                                <div class="result-value">${result.vehicle_count}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">Traffic Density</div>
                                <div>
                                    <span class="density-badge density-${result.density_level.toLowerCase()}">${result.density_level}</span>
                                </div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">Analysis Time</div>
                                <div style="color: #666;">${new Date(result.timestamp).toLocaleString()}</div>
                            </div>
                        </div>
                    `;
                }
            }

            if (data.summary) {
                html += `
                    <div class="lane-result-card" style="border-left-color: #764ba2;">
                        <div class="lane-result-title">Summary</div>
                        <div class="result-item">
                            <div class="result-label">Total Vehicles</div>
                            <div class="result-value">${data.summary.total_vehicles}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">Highest Congestion</div>
                            <div style="color: #667eea; font-weight: 600; margin-top: 10px;">
                                ${data.summary.highest_congestion_lane} (${data.summary.highest_congestion_density})
                            </div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            resultsContainer.innerHTML = html;
        }
    </script>
</body>
</html>
