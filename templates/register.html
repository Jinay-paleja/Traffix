{% extends "base.html" %}
{% block title %}Create account – Traffix{% endblock %}
{% block extra_css %}
<style>
  .auth-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
  }
  .auth-card .card {
    padding: 44px 40px;
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow), 0 0 80px rgba(56, 189, 248, 0.06);
  }
  .auth-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .auth-header .nav-brand {
    font-size: 1.5rem;
    display: inline-block;
    margin-bottom: 24px;
  }
  .auth-header a { color: inherit; }
  .auth-header a:hover { color: var(--accent); }
  .auth-title {
    font-size: 1.625rem;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .auth-subtitle {
    font-size: 0.9375rem;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  .auth-form .btn-primary {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    font-size: 1rem;
  }
  .auth-divider {
    text-align: center;
    margin: 28px 0 24px;
    color: var(--text-muted);
    font-size: 0.875rem;
  }
  .auth-footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.9375rem;
    color: var(--text-secondary);
  }
  .auth-footer a {
    font-weight: 600;
    color: var(--accent);
  }
  .auth-footer a:hover { color: var(--accent-hover); text-decoration: underline; }
  .password-input-wrapper { position: relative; }
  .password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 4px;
    display: flex;
    align-items: center;
    transition: color var(--transition-fast);
  }
  .password-toggle:hover { color: var(--accent); }
</style>
{% endblock %}
{% block body %}
<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <a href="{{ url_for('index') }}" class="nav-brand"><img src="{{ url_for('static', filename='images/traffix-mark.svg') }}" alt="" class="nav-brand-mark" aria-hidden="true"><span class="nav-brand-text">Traff<span>ix</span></span></a>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Get started with the Smart Traffic Signal Optimizer</p>
    </div>

    <form class="auth-form" action="{{ url_for('register') }}" method="post" id="register-form">
      <div class="input-group">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required autocomplete="name" />
      </div>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" required autocomplete="new-password" minlength="8" style="padding-right: 44px;" />
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>
      <div class="input-group">
        <label for="confirm-password">Confirm password</label>
        <div class="password-input-wrapper">
          <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required autocomplete="new-password" minlength="8" style="padding-right: 44px;" />
          <button type="button" class="password-toggle" onclick="togglePassword('confirm-password', this)" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-off-icon" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <div class="auth-divider">— or —</div>
    <p class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
  <a href="{{ url_for('index') }}" class="back-link">← Back to home</a>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<!-- Firebase JS SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/static/js/firebase-register.js"></script>
<script>
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const eyeIcon = btn.querySelector('.eye-icon');
  const eyeOffIcon = btn.querySelector('.eye-off-icon');
  
  if (input.type === 'password') {
    input.type = 'text';
    eyeIcon.style.display = 'none';
    eyeOffIcon.style.display = 'block';
    btn.setAttribute('aria-label', 'Hide password');
  } else {
    input.type = 'password';
    eyeIcon.style.display = 'block';
    eyeOffIcon.style.display = 'none';
    btn.setAttribute('aria-label', 'Show password');
  }
}
</script>
{% endblock %}
