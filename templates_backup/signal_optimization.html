<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Optimization - Traffix</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .optimization-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .optimization-header h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 2.5em;
        }

        .optimization-header p {
            color: #666;
            margin: 0;
            font-size: 1.1em;
        }

        .optimization-info {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .info-card {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-card .label {
            color: #999;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-card .value {
            color: #333;
            font-size: 1.8em;
            font-weight: 700;
        }

        .lanes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .lane-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s;
        }

        .lane-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .lane-name {
            color: #667eea;
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .timing-info {
            background: #f0f2ff;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .timing-label {
            color: #999;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .green-time {
            color: #4CAF50;
            font-size: 2em;
            font-weight: 700;
            margin: 10px 0;
        }

        .signals-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .signals-section h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .phase-timeline {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .phase-block {
            flex: 1;
            min-width: 100px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: white;
            font-weight: 600;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s;
        }

        .phase-block:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .phase-green {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .phase-yellow {
            background: linear-gradient(135deg, #FFC107 0%, #ffb300 100%);
        }

        .phase-red {
            background: linear-gradient(135deg, #F44336 0%, #da190b 100%);
        }

        .phase-time {
            font-size: 1.5em;
            font-weight: 700;
            margin: 5px 0;
        }

        .phase-label {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .recommendations-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .recommendations-section h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .recommendation-item {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .recommendation-item.critical {
            border-left-color: #F44336;
            background: #ffebee;
        }

        .recommendation-item.high {
            border-left-color: #FF9800;
            background: #fff3e0;
        }

        .recommendation-item.low {
            border-left-color: #4CAF50;
            background: #e8f5e9;
        }

        .recommendation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .recommendation-direction {
            font-weight: 700;
            color: #333;
            font-size: 1.1em;
        }

        .recommendation-severity {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            color: white;
        }

        .severity-critical {
            background: #F44336;
        }

        .severity-high {
            background: #FF9800;
        }

        .severity-low {
            background: #4CAF50;
        }

        .recommendation-message {
            color: #666;
            margin: 10px 0;
        }

        .recommendation-action {
            color: #667eea;
            font-weight: 600;
            padding: 8px 0;
            border-top: 1px solid rgba(102, 126, 234, 0.2);
            margin-top: 10px;
            padding-top: 10px;
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .nav-back:hover {
            transform: translateX(-5px);
        }

        .nav-back::before {
            content: "← ";
            margin-right: 5px;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .input-field {
            display: flex;
            flex-direction: column;
        }

        .input-field label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .input-field input {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-field input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-optimize {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            align-self: flex-end;
        }

        .btn-optimize:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('intersections') }}" class="nav-back">Back to Intersections</a>

        <div class="optimization-header">
            <h1>🚦 Signal Optimization</h1>
            <p>{{ intersection.name }} - {{ intersection.location }}</p>
        </div>

        <!-- Input Section -->
        <div class="optimization-info">
            <h3 style="margin-top: 0; color: #667eea;">Enter Traffic Data for Each Direction</h3>
            <div class="input-group" id="inputGroup">
                <!-- Will be populated by JavaScript -->
            </div>
            <button class="btn-optimize" id="optimizeBtn">Calculate Optimal Timing</button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" style="display: none;">
            <!-- Lanes Grid -->
            <div class="lanes-grid" id="lanesGrid">
                <!-- Will be populated by JavaScript -->
            </div>

            <!-- Signal Schedule -->
            <div class="signals-section" id="scheduleSection" style="display: none;">
                <h2>⏱️ Signal Schedule</h2>
                <div id="scheduleContent">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>

            <!-- Recommendations -->
            <div class="recommendations-section" id="recommendationsSection" style="display: none;">
                <h2>💡 AI Recommendations</h2>
                <div id="recommendationsContent">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const intersection = {{ intersection | tojson }};
        const inputGroupDiv = document.getElementById('inputGroup');
        const optimizeBtn = document.getElementById('optimizeBtn');
        const resultsSection = document.getElementById('resultsSection');
        const lanesGrid = document.getElementById('lanesGrid');
        const scheduleSection = document.getElementById('scheduleSection');
        const recommendationsSection = document.getElementById('recommendationsSection');

        // Generate input fields for each lane
        function generateInputs() {
            let html = '';
            intersection.lanes.forEach((lane, idx) => {
                const direction = lane.direction.toLowerCase();
                html += `
                    <div class="input-field">
                        <label for="vehicles-${idx}">
                            ${lane.direction.toUpperCase()} - Vehicle Count
                        </label>
                        <input type="number" id="vehicles-${idx}" data-direction="${lane.direction}" 
                               value="0" min="0" max="100" placeholder="0">
                    </div>
                `;
            });
            inputGroupDiv.innerHTML = html;
        }

        generateInputs();

        optimizeBtn.addEventListener('click', async () => {
            // Collect input data
            const trafficData = {};
            intersection.lanes.forEach((lane, idx) => {
                const vehicleInput = document.getElementById(`vehicles-${idx}`);
                trafficData[lane.direction] = {
                    vehicles: parseInt(vehicleInput.value) || 0,
                    priority: calculatePriority(parseInt(vehicleInput.value) || 0)
                };
            });

            optimizeBtn.disabled = true;
            resultsSection.style.display = 'none';

            try {
                const response = await fetch('/api/optimize-signals', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        intersection_id: intersection.id,
                        traffic_data: trafficData
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    displayOptimization(data);
                    resultsSection.style.display = 'block';
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                optimizeBtn.disabled = false;
            }
        });

        function calculatePriority(vehicles) {
            if (vehicles < 5) return 1;
            if (vehicles < 15) return 2;
            if (vehicles < 30) return 3;
            return 4;
        }

        function displayOptimization(data) {
            // Display lanes with green times
            lanesGrid.innerHTML = '';
            const optimization = data.optimization;
            
            intersection.lanes.forEach(lane => {
                const direction = lane.direction;
                const greenTime = optimization.green_times[direction] || 30;
                
                lanesGrid.innerHTML += `
                    <div class="lane-card">
                        <div class="lane-name">${direction}</div>
                        <div class="timing-info">
                            <div class="timing-label">Green Time</div>
                            <div class="green-time">${greenTime}s</div>
                            <div class="timing-label">Yellow: ${optimization.yellow_time}s</div>
                            <div class="timing-label">All-Red: ${optimization.all_red_time}s</div>
                            <div style="margin-top: 10px; color: #667eea; font-weight: 600;">
                                Total: ${greenTime + optimization.yellow_time + optimization.all_red_time}s
                            </div>
                        </div>
                    </div>
                `;
            });

            // Display schedule
            if (data.schedule && data.schedule.schedule) {
                let scheduleHtml = '';
                for (const [direction, schedule] of Object.entries(data.schedule.schedule)) {
                    const phase = schedule.phase.split('+').map(p => p.trim());
                    scheduleHtml += `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: #667eea; margin-bottom: 15px;">${direction.toUpperCase()}</h3>
                            <div class="phase-timeline">
                                <div class="phase-block phase-green">
                                    <div class="phase-label">Green</div>
                                    <div class="phase-time">${schedule.green_duration}s</div>
                                </div>
                                <div class="phase-block phase-yellow">
                                    <div class="phase-label">Yellow</div>
                                    <div class="phase-time">${schedule.yellow_duration}s</div>
                                </div>
                                <div class="phase-block phase-red">
                                    <div class="phase-label">All-Red</div>
                                    <div class="phase-time">${schedule.all_red_duration}s</div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('scheduleContent').innerHTML = scheduleHtml;
                scheduleSection.style.display = 'block';
            }

            // Display recommendations
            if (data.recommendations && data.recommendations.recommendations) {
                let recsHtml = '';
                data.recommendations.recommendations.forEach(rec => {
                    const severity = rec.severity.toLowerCase();
                    recsHtml += `
                        <div class="recommendation-item ${severity}">
                            <div class="recommendation-header">
                                <div class="recommendation-direction">${rec.direction}</div>
                                <span class="recommendation-severity severity-${severity}">${rec.severity.toUpperCase()}</span>
                            </div>
                            <div class="recommendation-message">${rec.message}</div>
                            <div class="recommendation-action">→ ${rec.action}</div>
                        </div>
                    `;
                });
                document.getElementById('recommendationsContent').innerHTML = recsHtml || 
                    '<p style="color: #666;">No special recommendations at this time.</p>';
                recommendationsSection.style.display = 'block';
            }
        }
    </script>
</body>
</html>
